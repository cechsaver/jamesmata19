name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # เปลี่ยนเป็น Node 22 (LTS ล่าสุด) เพื่อเลี่ยงคำเตือน deprecation
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        # เปลี่ยนจาก npm ci เป็น npm install เพื่อลดปัญหาเรื่องไฟล์ lock ไม่ตรงกัน
        run: npm install

      - name: Build Angular Project
        # เพิ่มหน่วยความจำให้ Node กรณีโปรเจกต์ใหญ่ (Optional)
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: npx ng build --configuration production --base-href /jamesmata19/

      - name: Copy index.html to 404.html
        run: cp dist/sakai-ng/index.html dist/sakai-ng/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/sakai-ng'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
