<div class="grid grid-nogutter equipment-card-container">
  <!-- Top Row -->
  <div class="col-12 border-bottom-dashed pb-2 mb-2">
    <div class="grid grid-nogutter align-items-center">
      <div class="col-9 pr-2">
        <p-dropdown
          [autoDisplayFirst]="false"
          [resetFilterOnHide]="true"
          [options]="itemList"
          [filter]="true"
          filterBy="label"
          scrollHeight="350px"
          [(ngModel)]="itemId"
          [showClear]="true"
          (onChange)="onSelectItem('itemId', $event.value)"
          (onClear)="onClearItem()"
          [placeholder]="placeholder"
          [appendTo]="'body'"
          styleClass="w-full"
        >
          <ng-template let-item pTemplate="selectedItem">
            <div class="flex align-items-center gap-2" *ngIf="itemId">
              <img src="assets/demo/images/items/{{ item.value }}.png" alt="" class="item-icon-small" />
              <div class="text_ellips font-bold">{{ item.label }}</div>
            </div>
          </ng-template>
        </p-dropdown>
      </div>
      <div class="col-3 pl-1">
        <p-dropdown 
          [options]="refineList" 
          [(ngModel)]="itemRefine" 
          scrollHeight="350px" 
          [disabled]="!itemId" 
          (onChange)="onSelectItem('itemRefine', itemId, $event.value)" 
          [appendTo]="'body'"
          styleClass="w-full"
        >
          <ng-template let-item pTemplate="selectedItem">
            <div class="text-center font-bold text-primary">{{ item.label > 0 ? '+' : '' }}{{ item.label || 0 }}</div>
          </ng-template>
        </p-dropdown>
      </div>
    </div>
  </div>

  <!-- Bottom Row -->
  <div class="col-12" *ngIf="itemId">
    <div class="grid grid-nogutter">
      <div class="col-3 px-1" [hidden]="enchant2List.length === 0">
        <p-dropdown
          [autoDisplayFirst]="false"
          [resetFilterOnHide]="true"
          [options]="enchant2List"
          [filter]="true"
          filterBy="label"
          scrollHeight="350px"
          [(ngModel)]="enchant2Id"
          [showClear]="true"
          [disabled]="enchant2List.length === 0 || !itemId"
          (onChange)="onSelectItem('enchant2Id', $event.value)"
          placeholder="Enc 2"
          [appendTo]="'body'"
          styleClass="w-full text-xs"
        >
          <ng-template let-item pTemplate="selectedItem">
            <div class="flex align-items-center gap-1 text-xs" *ngIf="enchant2Id">
              <img src="assets/demo/images/items/{{ item.value }}.png" alt="" class="item-icon-tiny" />
              <div class="text-truncate">{{ item.label }}</div>
            </div>
          </ng-template>
        </p-dropdown>
      </div>
      <div class="col-3 px-1" [hidden]="enchant3List.length === 0">
        <p-dropdown
          [autoDisplayFirst]="false"
          [resetFilterOnHide]="true"
          [options]="enchant3List"
          [filter]="true"
          filterBy="label"
          scrollHeight="350px"
          [(ngModel)]="enchant3Id"
          [showClear]="true"
          [disabled]="enchant3List.length === 0 || !itemId"
          (onChange)="onSelectItem('enchant3Id', $event.value)"
          placeholder="Enc 3"
          [appendTo]="'body'"
          styleClass="w-full text-xs"
        >
          <ng-template let-item pTemplate="selectedItem">
            <div class="flex align-items-center gap-1 text-xs" *ngIf="enchant3Id">
              <img src="assets/demo/images/items/{{ item.value }}.png" alt="" class="item-icon-tiny" />
              <div class="text-truncate">{{ item.label }}</div>
            </div>
          </ng-template>
        </p-dropdown>
      </div>
      <div class="col-3 px-1" [hidden]="enchant4List.length === 0">
        <p-dropdown
          [autoDisplayFirst]="false"
          [resetFilterOnHide]="true"
          [options]="enchant4List"
          [filter]="true"
          filterBy="label"
          scrollHeight="350px"
          [(ngModel)]="enchant4Id"
          [showClear]="true"
          [disabled]="enchant4List.length === 0 || !itemId"
          (onChange)="onSelectItem('enchant4Id', $event.value)"
          placeholder="Enc 4"
          [appendTo]="'body'"
          styleClass="w-full text-xs"
        >
          <ng-template let-item pTemplate="selectedItem">
            <div class="flex align-items-center gap-1 text-xs" *ngIf="enchant4Id">
              <img src="assets/demo/images/items/{{ item.value }}.png" alt="" class="item-icon-tiny" />
              <div class="text-truncate">{{ item.label }}</div>
            </div>
          </ng-template>
        </p-dropdown>
      </div>
      <div class="col-3 px-1">
        <p-cascadeSelect
          [(ngModel)]="optionValue"
          [disabled]="!itemId"
          [options]="optionList"
          optionValue="value"
          optionGroupLabel="label"
          optionLabel="label"
          [optionGroupChildren]="['children', 'children']"
          placeholder="Opt"
          [showClear]="true"
          (onChange)="onOptionChange($event)"
          (onClear)="onOptionChange($event)"
          [appendTo]="'body'"
          styleClass="w-full text-xs"
        ></p-cascadeSelect>
      </div>
    </div>
  </div>
</div>
